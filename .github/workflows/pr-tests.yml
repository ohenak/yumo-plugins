name: PR tests

# Unit-test gate for pull requests. Phase PUB of the pdlc pipeline polls this
# workflow's check results via `gh pr view --json statusCheckRollup` and halts the
# pipeline if any required check fails, so every job here is a real gate: keep it
# deterministic, and do not add a job that can fail for reasons unrelated to the diff.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# One in-flight run per ref. A new push supersedes the previous run rather than
# queueing behind it; `main` is excluded so pushes there are never cancelled.
concurrency:
  group: pr-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # Run every combination to completion: a macOS-only or Linux-only failure is
      # exactly the portability signal this matrix exists to surface, and cancelling
      # siblings would hide whether the break is platform-specific.
      fail-fast: false
      matrix:
        # The plugin ships bash scripts that must run on both the maintainer's macOS
        # (bash 3.2 — no associative arrays, no `${var^^}`, no `mapfile`, no `stat -c`)
        # and on Linux CI (bash 5). Testing both is what keeps the 3.2 constraints honest.
        os: [ubuntu-latest]
        node: ['24']

    steps:
      - uses: actions/checkout@v4
        with:
          # The learnings-baseline guard (learningsBaselineGuard.test.js) checks the
          # pinned pre-feature merge-base sha is an ancestor of HEAD, and the capture
          # entry-point test (learningsCaptureScript.test.js) adds a worktree at that
          # sha — both need the commit present, which the default shallow checkout
          # does not provide.
          fetch-depth: 0

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: pdlc/workflows/package-lock.json

      - name: Record the environment under test
        # The suite gates capability-dependent tests on these, and skips loudly when one
        # is unavailable. Printing them means a change in skip count can be explained from
        # the log rather than guessed at.
        run: |
          echo "bash:    $(bash --version | head -1)"
          echo "git:     $(git --version)"
          echo "node:    $(node -v)"
          echo "uid:     $(id -u)  (non-zero => the uid-nonroot capability is available)"
          for tool in python3 shasum sha1sum; do
            printf '%-8s %s\n' "$tool:" "$(command -v "$tool" || echo '(absent)')"
          done

      - name: Install dependencies
        working-directory: pdlc/workflows
        run: npm ci

      - name: Unit tests
        working-directory: pdlc/workflows
        # A `globalTeardown` failure (the run-wide capability-skip comparator) is reported
        # AFTER jest's summary and is not reflected in it, so this step must be judged by
        # npm's exit code — which it is, since bash `set -e` semantics apply per step.
        #
        # `test:coverage` runs two stages: `c8 npm test -- --runInBand` followed by
        # `c8 report --check-coverage --per-file ...`, with the declared floor enforced in
        # aggregate and branch ≥85% enforced per module. The coverage stage runs jest
        # in-band deliberately: a force-exited worker never flushes NODE_V8_COVERAGE, so
        # worker-parallel coverage under-reports nondeterministically on small runners;
        # in-band, every evaluation lands in the one process c8 reads on clean exit.
        # jest's own --coverage reports 0% for these modules because
        # under --experimental-vm-modules they are evaluated as ESM through jest's vm-module
        # path; c8 reads V8's coverage and sees them (CODE_REVIEW v1 §1-2).
        run: npm run test:coverage

  engine-tests:
    name: Engine tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # Same matrix as unit-tests (pr-tests.yml:40): the engine job tracks whatever
      # unit-tests runs rather than declaring a second, independently-drifting platform
      # list (TSPEC §7.6).
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          # The pre-flight baseline gate (preflight-baseline.test.js) resolves the
          # pre-sweep ancestor via `git merge-base origin/main HEAD` and checks the
          # baseline doc's partition-closure commit is an ancestor — both need full
          # history, which the default shallow checkout does not provide.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pdlc/engine/package-lock.json

      - name: Install dependencies
        working-directory: pdlc/engine
        run: npm ci

      - name: Engine tests
        working-directory: pdlc/engine
        # Deliberately the package.json `test` script, not the raw test-runner invocation
        # it wraps — the --import bootstrap flag and the suite-wide assertion step live
        # inside that script (§7.0), and a job that spelled the runner call out directly
        # would run without both.
        run: npm test

  script-syntax:
    name: Shell scripts parse
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # A syntax-only pass (`bash -n`) over every shipped script. Deliberately not
      # shellcheck: this is a gate, and a style warning must never block a PR.
      - name: bash -n every shipped script
        run: |
          status=0
          while IFS= read -r script; do
            if bash -n "$script"; then
              echo "ok    $script"
            else
              echo "::error file=$script::bash -n reported a syntax error"
              status=1
            fi
          done < <(git ls-files '*.sh')
          exit "$status"
